[package]
name = "steamsync-tauri"
version = "0.1.0"
description = "Native Tauri GUI for syncing Epic/itch.io/Xbox/legendary games into Steam"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "steamsync_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyvalues-parser = "0.2"
crc32fast = "1"
thiserror = "1"
dirs = "5"
quick-xml = "0.36"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
futures = "0.3"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
